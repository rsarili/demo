[package]
name = "client"
version = "0.1.0"
edition = "2021"

[dependencies]
aws-config = "1.6.3"
aws-sdk-cloudformation = "1.80.0"
rand = "0.9.1"
reqwest = { version = "0.12.12", features = ["blocking", "json"] }
rumqttc = "0.24.0"
serde = { version = "1.0.219", features = ["derive"] }
sysinfo = "0.35.2"
tokio = { version = "1.45.1", features = ["rt-multi-thread"] }
